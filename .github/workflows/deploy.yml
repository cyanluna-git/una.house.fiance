name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # API 회귀 실패 시 배포를 중단한다.
      # 테스트가 `next dev`로 .next를 덮어쓰므로 반드시 운영 빌드보다 먼저 실행한다.
      - name: API tests
        run: pnpm test:api

      - name: 운영 빌드 (깨끗한 .next)
        run: |
          rm -rf .next test.db test.db-shm test.db-wal .test-server.pid
          pnpm build
          test -f .next/BUILD_ID || { echo ".next/BUILD_ID 없음 — 운영 빌드가 아님"; exit 1; }
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # 모바일/태블릿 레이아웃 회귀 검사 (실패하면 배포 중단). 빈 test.db로 운영 빌드를 띄워 검사한다.
      - name: 브라우저 설치 (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: 레이아웃 검사 (화면 14개 × 뷰포트 5개)
        run: |
          pnpm test:layout
          rm -f test.db test.db-shm test.db-wal
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 운영용 의존성만 남기기
        run: pnpm prune --prod

      - name: 아티팩트 만들기 (DB, .env는 절대 포함하지 않음)
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' --exclude='.env*' --exclude='.next/cache' \
            .next node_modules public package.json next.config.mjs pnpm-lock.yaml ecosystem.config.cjs
          ls -lh /tmp/release.tar.gz
          tar -tzf /tmp/release.tar.gz | grep -qx '.next/BUILD_ID' || { echo "아티팩트에 BUILD_ID 없음"; exit 1; }
          tar -tzf /tmp/release.tar.gz | grep -E '^(\./)?([^/]+\.db(-wal|-shm)?|\.env[^/]*)$' && { echo "DB/.env가 아티팩트에 포함됨"; exit 1; } || true

      - name: SSH 설정
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: 업로드 및 배포
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/release.tar.gz scripts/deploy-remote.sh "$USER_NAME@$HOST:/tmp/"
          $SSH "$USER_NAME@$HOST" "chmod +x /tmp/deploy-remote.sh && /tmp/deploy-remote.sh /tmp/release.tar.gz ${GITHUB_SHA}"

      - name: 외부 헬스 체크
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://unahouse.cyanluna.com/unlock || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          exit 1

      - name: 공개 URL 스모크 (무쿠키 리다이렉트)
        run: bash scripts/smoke-public.sh https://unahouse.cyanluna.com
